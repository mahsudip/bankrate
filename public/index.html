<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank Deposit Rates</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container p-4">
      <div id="loader" class="alert alert-info">⏳ Fetching latest data...</div>

      <div id="main-ui" style="display: none">
        <h2 class="text-center mb-4">Bank Deposit Rates</h2>
        <hr />
        <ul class="nav nav-tabs nav-fill mb-3" id="tabs">
          <li class="nav-item">
            <a class="nav-link active" data-tab="saving" href="#">Saving</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="fixed" href="#">Fixed</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="favourites" href="#">Favourites</a>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Saving Tab -->
          <div id="saving" class="tab-pane active">
            <div class="row g-3 align-items-center">
              <div class="col-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="saving-bank"
                ></select>
              </div>
              <div class="col-sm-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="saving-type"
                  disabled
                ></select>
              </div>
              <div class="col-sm-12 d-flex align-items-end">
                <button
                  id="saving-add-btn"
                  class="btn btn-primary w-100"
                  onclick="addSelectedToCompare('saving')"
                  disabled
                >
                  Add to Compare
                </button>
              </div>
            </div>
            <div class="compare-section mt-4">
              <button
                class="btn btn-danger mb-2"
                onclick="clearCompareList('saving')"
              >
                Clear List
              </button>
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th class="col-6">Bank</th>
                      <th class="col-2">Int</th>
                      <th class="col-2">Min</th>
                      <th class="col-2">-</th>
                    </tr>
                  </thead>
                  <tbody id="saving-compare-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Fixed Tab -->
          <div id="fixed" class="tab-pane">
            <div class="row g-3 align-items-center">
              <div class="col-sm-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="fixed-bank"
                ></select>
              </div>
              <div class="col-sm-12 col-md-6">
                <select class="form-select" id="fixed-type" disabled></select>
              </div>
              <div class="col-sm-12 d-flex align-items-end">
                <button
                  id="fixed-add-btn"
                  class="btn btn-success w-100"
                  onclick="addSelectedToCompare('fixed')"
                  disabled
                >
                  Add to Compare
                </button>
              </div>
            </div>
            <div class="compare-section mt-4">
              <button
                class="btn btn-danger mb-2"
                onclick="clearCompareList('fixed')"
              >
                Clear List
              </button>
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th class="col-6">Bank</th>
                      <th class="col-2">Int</th>
                      <th class="col-2">Tenure</th>
                      <th class="col-2">-</th>
                    </tr>
                  </thead>
                  <tbody id="fixed-compare-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Favourites Tab -->
          <div id="favourites" class="tab-pane">
            <h4>Add Your Favourite Bank</h4>
            <div class="row g-3 align-items-center mb-3">
              <div class="col-md-6">
                <select class="form-select" id="fav-bank">
                  <option value="">Select Bank</option>
                </select>
              </div>
              <div class="col-md-6">
                <select class="form-select" id="fav-type" disabled>
                  <option value="">Select Type</option>
                </select>
              </div>
              <div class="col-12">
                <button
                  class="btn btn-warning w-100"
                  id="fav-add-btn"
                  disabled
                  onclick="addToFavourites()"
                >
                  ➕ Add to Favourites
                </button>
              </div>
            </div>

            <div class="row" id="favourite-list">
              <!-- Favourite cards go here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const savingCompareList = [];
      const fixedCompareList = [];
      let favouriteList = [];

      // Load favourites from localStorage if present
      function loadFavouritesFromStorage() {
        const stored = localStorage.getItem("bankFavourites");
        if (stored) {
          try {
            favouriteList = JSON.parse(stored);
          } catch {
            favouriteList = [];
          }
        }
      }

      // Save favourites to localStorage
      function saveFavouritesToStorage() {
        localStorage.setItem("bankFavourites", JSON.stringify(favouriteList));
      }

      async function fetchAndLoadData() {
        try {
          await Promise.all([fetch("/scrape-savings"), fetch("/scrape-fixed")]);
          await loadScript("/savinglist.js");
          await loadScript("/fixedlist.js");

          document.getElementById("loader").style.display = "none";
          document.getElementById("main-ui").style.display = "block";

          initTab("saving", window.savinglist);
          initTab("fixed", window.fixedlist);
          setupTabs();
          setupFavouritesTab();

          loadFavouritesFromStorage();
          renderFavourites();
        } catch (error) {
          document.getElementById("loader").innerText =
            "❌ Failed to load data: " + error.message;
        }
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      function getUniqueBanks(data) {
        return [...new Set(data.map((item) => item.bank))].sort();
      }

      function getTypesForBank(data, bank) {
        return [
          ...new Set(data.filter((item) => item.bank === bank).map((item) => item.type)),
        ].sort();
      }

      function populateBankSelect(data, bankSelect, typeSelect, addButton) {
        const banks = getUniqueBanks(data);
        bankSelect.innerHTML =
          `<option value="">Choose a Bank</option>` +
          banks.map((bank) => `<option value="${bank}">${bank}</option>`).join("");

        bankSelect.onchange = () => {
          const selectedBank = bankSelect.value;
          typeSelect.disabled = true;
          addButton.disabled = true;

          if (!selectedBank) {
            typeSelect.innerHTML = "";
            return;
          }

          const types = getTypesForBank(data, selectedBank);
          typeSelect.innerHTML =
            `<option value="">Choose a A/C Type</option>` +
            types.map((type) => `<option value="${type}">${type}</option>`).join("");
          typeSelect.disabled = false;
        };

        typeSelect.onchange = () => {
          addButton.disabled = !typeSelect.value;
        };

        typeSelect.disabled = true;
        addButton.disabled = true;
      }

      function addSelectedToCompare(tab) {
        const dataList = tab === "saving" ? window.savinglist : window.fixedlist;
        const bank = document.getElementById(`${tab}-bank`).value;
        const type = document.getElementById(`${tab}-type`).value;
        const match = dataList.find((item) => item.bank === bank && item.type === type);
        if (match) {
          if (tab === "saving") savingCompareList.push(match);
          else fixedCompareList.push(match);
          renderCompareList(tab);
        }

        document.getElementById(`${tab}-bank`).value = "";
        document.getElementById(`${tab}-type`).innerHTML = "";
        document.getElementById(`${tab}-type`).disabled = true;
        document.getElementById(`${tab}-add-btn`).disabled = true;
      }

      function renderCompareList(tab) {
        const list = tab === "saving" ? savingCompareList : fixedCompareList;
        const tbody = document.getElementById(`${tab}-compare-table`);
        tbody.innerHTML =
          list
            .map(
              (item, index) => `
          <tr>
            <td>${item.bank}<br> <span>${item.type}</span></td>
            <td>${item.interest}</td>
            <td>${tab === "saving" ? item.minimum : item.tenure}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="removeFromCompare('${tab}', ${index})">🗑 Delete</button></td>
          </tr>
        `
            )
            .join("") ||
          `<tr><td colspan="5">No items in compare list</td></tr>`;
      }

      function removeFromCompare(tab, index) {
        if (tab === "saving") savingCompareList.splice(index, 1);
        else fixedCompareList.splice(index, 1);
        renderCompareList(tab);
      }

      function clearCompareList(tab) {
        if (tab === "saving") savingCompareList.length = 0;
        else if (tab === "fixed") fixedCompareList.length = 0;
        else {
          savingCompareList.length = 0;
          fixedCompareList.length = 0;
        }
        renderCompareList("saving");
        renderCompareList("fixed");
      }

      function initTab(tab, dataList) {
        const bankSelect = document.getElementById(`${tab}-bank`);
        const typeSelect = document.getElementById(`${tab}-type`);
        const addButton = document.getElementById(`${tab}-add-btn`);
        populateBankSelect(dataList, bankSelect, typeSelect, addButton);
      }

      function setupTabs() {
        document.querySelectorAll("#tabs .nav-link").forEach((tab) => {
          tab.onclick = (e) => {
            e.preventDefault();
            document.querySelectorAll("#tabs .nav-link").forEach((t) => t.classList.remove("active"));
            document.querySelectorAll(".tab-pane").forEach((c) => c.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById(tab.dataset.tab).classList.add("active");
          };
        });
      }

      // Favourites tab setup & functions
      function setupFavouritesTab() {
        const data = [...window.savinglist, ...window.fixedlist];
        const favBankSelect = document.getElementById("fav-bank");
        const favTypeSelect = document.getElementById("fav-type");
        const favAddBtn = document.getElementById("fav-add-btn");

        const uniqueBanks = [...new Set(data.map((d) => d.bank))].sort();
        favBankSelect.innerHTML =
          `<option value="">Select Bank</option>` +
          uniqueBanks.map((b) => `<option value="${b}">${b}</option>`).join("");

        favBankSelect.onchange = () => {
          const selectedBank = favBankSelect.value;
          favTypeSelect.disabled = true;
          favAddBtn.disabled = true;

          if (!selectedBank) {
            favTypeSelect.innerHTML = "";
            return;
          }

          const types = [...new Set(data.filter((d) => d.bank === selectedBank).map((d) => d.type))];
          favTypeSelect.innerHTML =
            `<option value="">Select Type</option>` +
            types.map((t) => `<option value="${t}">${t}</option>`).join("");
          favTypeSelect.disabled = false;
        };

        favTypeSelect.onchange = () => {
          favAddBtn.disabled = !favTypeSelect.value;
        };
      }

      function addToFavourites() {
        const bank = document.getElementById("fav-bank").value;
        const type = document.getElementById("fav-type").value;
        const data = [...window.savinglist, ...window.fixedlist];
        const match = data.find((d) => d.bank === bank && d.type === type);

        if (match && !favouriteList.find((f) => f.bank === bank && f.type === type)) {
          favouriteList.push(match);
          saveFavouritesToStorage();
          renderFavourites();
        }

        document.getElementById("fav-bank").value = "";
        document.getElementById("fav-type").innerHTML = "";
        document.getElementById("fav-type").disabled = true;
        document.getElementById("fav-add-btn").disabled = true;
      }

      function renderFavourites() {
        const container = document.getElementById("favourite-list");
        container.innerHTML =
          favouriteList.length === 0
            ? `<p>No favourites added yet.</p>`
            : favouriteList
                .map(
                  (item, i) => `
          <div class="col-sm-6 col-md-4 col-lg-3 mb-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h5 class="card-title text-center">${item.bank}</h5>
                <p class="text-muted text-center mb-1">${item.type}</p>
                <p class="text-center mb-0">Interest: <strong>${item.interest}</strong></p>
                ${item.minimum ? `<p class="text-center mb-0">Min: ${item.minimum}</p>` : ""}
                ${item.tenure ? `<p class="text-center mb-0">Tenure: ${item.tenure}</p>` : ""}
                <div class="d-grid mt-3">
                  <button class="btn btn-sm btn-outline-danger" onclick="removeFavourite(${i})">Remove</button>
                </div>
              </div>
            </div>
          </div>`
                )
                .join("");
      }

      function removeFavourite(index) {
        favouriteList.splice(index, 1);
        saveFavouritesToStorage();
        renderFavourites();
      }

      fetchAndLoadData();
    </script>
  </body>
</html>
