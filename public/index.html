<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank Deposit Rates</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <style></style>
  </head>
  <body>
    <!-- <div class="pull-to-refresh"></div> -->
    <div class="container p-4">
      <div id="loader" class="alert alert-info">⏳ Fetching latest data...</div>

      <div id="main-ui" style="display: none">
        <h2 class="text-center mb-4">Bank Deposit Rates</h2>
        <hr />
        <ul class="nav nav-tabs nav-fill mb-3" id="tabs">
          <li class="nav-item">
            <a class="nav-link active" data-tab="saving" href="#">Saving</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="fixed" href="#">Fixed</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="compare" href="#">Saving vs FD</a>
          </li>
        </ul>

        <div class="tab-content">
          <div id="saving" class="tab-pane active">
            <div class="row g-3 align-items-center">
              <div class="col-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="saving-bank"
                ></select>
              </div>
              <div class="col-sm-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="saving-type"
                  disabled
                ></select>
              </div>
              <div class="col-sm-12 d-flex align-items-end">
                <button
                  id="saving-add-btn"
                  class="btn btn-primary w-100"
                  onclick="addSelectedToCompare('saving')"
                  disabled
                >
                  Add to Compare
                </button>
              </div>
            </div>
            <div class="compare-section mt-4">
              <button
                class="btn btn-danger mb-2"
                onclick="clearCompareList('saving')"
              >
                Clear List
              </button>
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th class="col-6">Bank</th>
                      <th class="col-2">Int</th>
                      <th class="col-2">Min</th>
                      <th class="col-2">-</th>
                    </tr>
                  </thead>
                  <tbody id="saving-compare-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div id="fixed" class="tab-pane">
            <div class="row g-3 align-items-center">
              <div class="col-sm-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="fixed-bank"
                ></select>
              </div>
              <div class="col-sm-12 col-md-6">
                <select
                  class="form-select select-dropdown"
                  id="fixed-type"
                  disabled
                ></select>
              </div>
              <div class="col-sm-12 d-flex align-items-end">
                <button
                  id="fixed-add-btn"
                  class="btn btn-success w-100"
                  onclick="addSelectedToCompare('fixed')"
                  disabled
                >
                  Add to Compare
                </button>
              </div>
            </div>
            <div class="compare-section mt-4">
              <button
                class="btn btn-danger mb-2"
                onclick="clearCompareList('fixed')"
              >
                Clear List
              </button>
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th class="col-6">Bank</th>
                      <th class="col-2">Int</th>
                      <th class="col-2">Tenure</th>
                      <th class="col-2">-</th>
                    </tr>
                  </thead>
                  <tbody id="fixed-compare-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div id="compare" class="tab-pane">
            <div class="compare-section">
              <!--<button
                class="btn btn-danger mb-2"
                onclick="clearCompareList('all')"
              >
                Clear All
               </button> -->
              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-light">
                    <tr>
                      <th>Bank</th>
                      <th>Interest</th>
                      <th>Tenure</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="vs-compare-table"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const savingCompareList = [];
      const fixedCompareList = [];

      async function fetchAndLoadData() {
        try {
          await Promise.all([fetch("/scrape-savings"), fetch("/scrape-fixed")]);
          await loadScript("/savinglist.js");
          await loadScript("/fixedlist.js");

          document.getElementById("loader").style.display = "none";
          document.getElementById("main-ui").style.display = "block";

          initTab("saving", window.savinglist);
          initTab("fixed", window.fixedlist);
          setupTabs();
        } catch (error) {
          document.getElementById("loader").innerText =
            "❌ Failed to load data: " + error.message;
        }
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      function getUniqueBanks(data) {
        return [...new Set(data.map((item) => item.bank))].sort();
      }

      function getTypesForBank(data, bank) {
        return [
          ...new Set(
            data.filter((item) => item.bank === bank).map((item) => item.type)
          ),
        ].sort();
      }

      function populateBankSelect(data, bankSelect, typeSelect, addButton) {
        const banks = getUniqueBanks(data);
        bankSelect.innerHTML =
          `<option value="">Choose a Bank</option>` +
          banks
            .map((bank) => `<option value="${bank}">${bank}</option>`)
            .join("");

        bankSelect.onchange = () => {
          const selectedBank = bankSelect.value;
          typeSelect.disabled = true;
          addButton.disabled = true;

          if (!selectedBank) {
            typeSelect.innerHTML = "";
            return;
          }

          const types = getTypesForBank(data, selectedBank);
          typeSelect.innerHTML =
            `<option value="">Choose a A/C Type</option>` +
            types
              .map((type) => `<option value="${type}">${type}</option>`)
              .join("");
          typeSelect.disabled = false;
        };

        typeSelect.onchange = () => {
          addButton.disabled = !typeSelect.value;
        };

        typeSelect.disabled = true;
        addButton.disabled = true;
      }

      function addSelectedToCompare(tab) {
        const dataList =
          tab === "saving" ? window.savinglist : window.fixedlist;
        const bank = document.getElementById(`${tab}-bank`).value;
        const type = document.getElementById(`${tab}-type`).value;
        const match = dataList.find(
          (item) => item.bank === bank && item.type === type
        );
        if (match) {
          if (tab === "saving") savingCompareList.push(match);
          else fixedCompareList.push(match);
          renderCompareList(tab);
        }

        document.getElementById(`${tab}-bank`).value = "";
        document.getElementById(`${tab}-type`).innerHTML = "";
        document.getElementById(`${tab}-type`).disabled = true;
        document.getElementById(`${tab}-add-btn`).disabled = true;
      }

      function renderCompareList(tab) {
        const list = tab === "saving" ? savingCompareList : fixedCompareList;
        const tbody = document.getElementById(`${tab}-compare-table`);
        tbody.innerHTML =
          list
            .map(
              (item, index) => `
          <tr>
            <td>${item.bank}<br> <span>${item.type}</span></td>
            <td>${item.interest}</td>
            <td>${tab === "saving" ? item.minimum : item.tenure}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="removeFromCompare('${tab}', ${index})">🗑</button></td>
          </tr>
        `
            )
            .join("") ||
          `<tr><td colspan="5">No items in compare list</td></tr>`;
        renderVSCompareList();
      }

      function renderVSCompareList() {
        const all = [
          ...savingCompareList.map((item) => ({ ...item, source: "Saving" })),
          ...fixedCompareList.map((item) => ({ ...item, source: "Fixed" })),
        ];
        const tbody = document.getElementById("vs-compare-table");
        tbody.innerHTML =
          all
            .map(
              (item, index) => `
          <tr>
            <td> ${item.bank}<br> <span>${item.source}</span></td>
            <td>${item.interest}</td>
            <td>${item.tenure || "-"}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="removeFromVSCompare(${index})">🗑</button></td>
          </tr>
        `
            )
            .join("") ||
          `<tr><td colspan="7">No items in compare list</td></tr>`;
      }

      function removeFromCompare(tab, index) {
        if (tab === "saving") savingCompareList.splice(index, 1);
        else fixedCompareList.splice(index, 1);
        renderCompareList(tab);
      }

      function removeFromVSCompare(index) {
        const totalSaving = savingCompareList.length;
        if (index < totalSaving) {
          removeFromCompare("saving", index);
        } else {
          removeFromCompare("fixed", index - totalSaving);
        }
      }

      function clearCompareList(tab) {
        if (tab === "saving") savingCompareList.length = 0;
        else if (tab === "fixed") fixedCompareList.length = 0;
        else {
          savingCompareList.length = 0;
          fixedCompareList.length = 0;
        }
        renderCompareList("saving");
        renderCompareList("fixed");
      }

      function initTab(tab, dataList) {
        const bankSelect = document.getElementById(`${tab}-bank`);
        const typeSelect = document.getElementById(`${tab}-type`);
        const addButton = document.getElementById(`${tab}-add-btn`);
        populateBankSelect(dataList, bankSelect, typeSelect, addButton);
      }

      function setupTabs() {
        document.querySelectorAll("#tabs .nav-link").forEach((tab) => {
          tab.onclick = (e) => {
            e.preventDefault();
            document
              .querySelectorAll("#tabs .nav-link")
              .forEach((t) => t.classList.remove("active"));
            document
              .querySelectorAll(".tab-pane")
              .forEach((c) => c.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById(tab.dataset.tab).classList.add("active");
          };
        });
      }

      fetchAndLoadData();

      const pullToRefresh = document.querySelector(".pull-to-refresh");
      let touchstartY = 0;
      document.addEventListener("touchstart", (e) => {
        touchstartY = e.touches[0].clientY;
      });
      document.addEventListener("touchmove", (e) => {
        const touchY = e.touches[0].clientY;
        const touchDiff = touchY - touchstartY;
        if (touchDiff > 0 && window.scrollY === 0) {
          pullToRefresh.classList.add("visible");
          e.preventDefault();
        }
      });
      document.addEventListener("touchend", (e) => {
        if (pullToRefresh.classList.contains("visible")) {
          pullToRefresh.classList.remove("visible");
          location.reload();
        }
      });
    </script>
  </body>
</html>
